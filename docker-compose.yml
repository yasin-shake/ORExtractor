# Read-only EC2 deployment: pre-built extracted_data/ and .chroma_db/ are bind-mounted
# from the host (transferred outside git). Ingest/extract cannot write inside the container.
services:
  ni43101-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./knowledge:/app/knowledge:ro
      - ./extracted_data:/app/extracted_data:ro
      - ./.chroma_db:/app/.chroma_db:ro
    restart: unless-stopped
